apiVersion: apps/v1
kind: Deployment
metadata:
  name: suomicoolfun
  labels:
    app: suomicoolfun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suomicoolfun
  template:
    metadata:
      labels:
        app: suomicoolfun
    spec:
      containers:
        - name: suomicoolfun
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: suomicoolfun
  labels:
    app: suomicoolfun
spec:
  type: LoadBalancer
  selector:
    app: suomicoolfun
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  loadBalancerIP: LOAD_BALANCER_IP_PLACEHOLDER
